# ==============================================================================
#  RETAINED DELIBERATELY DURING THE NETLIFY -> VERCEL MIGRATION. DO NOT DELETE.
#
#  This file is superseded by vercel.json at the repo root, but is kept on
#  purpose until the cutover is finished. Follow the ordered steps in
#  docs/runbooks/netlify-to-vercel.md, which say when this file may go.
#
#  If you delete it while the Netlify site is still connected to this
#  repository, Netlify loses its publish directory and falls back to its
#  default, which is the repository ROOT. That would publish platform/ (the
#  CRM backend source) and docs/ (the internal architecture and compliance
#  documents) on the public website at berelax.ae. A day of paying for two
#  hosts is cheaper than that by every measure.
#
#  Correct order, from the runbook: Vercel verified -> DNS moved and settled ->
#  Netlify site deleted -> only then this file removed. It is harmless while
#  the Netlify site no longer exists.
# ==============================================================================

# BE RELAX — static site, no framework build.
#
# The publish directory is assembled rather than set to "." because the repo
# root also holds the CRM backend source (platform/) and the internal
# architecture docs (docs/). With publish = "." those would be served on the
# public website. The command below copies only the site itself.
#
# There is deliberately no package.json at the repo root, so Netlify does not
# detect a Node project and never runs an install step.

[build]
  publish = "_site"
  command = "mkdir -p _site && cp index.html privacy.html _site/ && cp -R assets _site/assets"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Photos and video are replaced under the same filenames, so keep the cache
# short enough that a swapped image shows up the same day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The privacy notice carries the version string that consent records are filed
# against. A stale cached copy would show a guest the wrong version, so it is
# revalidated on every request like index.html.
[[headers]]
  for = "/privacy.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
