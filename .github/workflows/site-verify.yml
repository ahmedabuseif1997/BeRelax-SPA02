name: Site Verify

# ═══════════════════════════════════════════════════════════════════════════════
#  THE PUBLIC SITE'S PUBLISH DIRECTORY IS AN ALLOWLIST. THIS ENFORCES IT.
#
#  The repository root holds the website AND the CRM backend source
#  (platform/), the architecture spec and the compliance file (docs/), and the
#  deploy pipeline (.github/). Neither host is told "serve the repo" — both are
#  told to assemble a directory containing three things and serve that.
#
#  docs/runbooks/netlify-to-vercel.md §2 is the human version of this check.
#  A human runs it once, at cutover, while tired. These jobs run it every time.
#
#  ── TWO JOBS, TWO DIFFERENT MOMENTS ──────────────────────────────────────────
#
#  publish-dir  runs on every push that touches the site. It builds _site/ with
#               the command taken OUT OF vercel.json (not a copy of it — the
#               file itself, so the two cannot drift) and fails if anything but
#               the three allowed entries lands in it. This catches a leak
#               BEFORE it is ever deployed.
#
#  live-check   runs on demand against a deployed URL. It is runbook §2.1-§2.3
#               executed rather than read: what must be served, what must NOT
#               be served, and the security headers. Run it against the
#               *.vercel.app URL before touching DNS, and again after.
#
#  ── WHY THE MUST-NOT-SERVE LIST IS PARTLY GENERATED ──────────────────────────
#
#  A hand-written denylist fails open the day someone adds a fourth directory
#  to the repository root: nobody remembers to add it here. So live-check reads
#  the actual top-level of the repository at the checked-out commit and asserts
#  that every entry which is not one of the three allowed ones returns 404.
#  Add a directory tomorrow and it is covered tomorrow, without an edit.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'assets/**'
      - 'vercel.json'
      - 'netlify.toml'
      - '.github/workflows/site-verify.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'assets/**'
      - 'vercel.json'
      - '.github/workflows/site-verify.yml'
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment to check, no trailing slash (e.g. https://xxxx.vercel.app). Leave empty to run the publish-directory check only.'
        required: false
        type: string
      compare_to:
        description: 'Optional: a second origin to diff headers against, e.g. the site that is live today. Leave empty to skip the diff.'
        required: false
        type: string

concurrency:
  group: site-verify-${{ github.ref }}-${{ github.event.inputs.deployment_url }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  #  Does the build produce a publish directory containing ONLY the site?
  # ───────────────────────────────────────────────────────────────────────────
  publish-dir:
    name: Publish directory contains only the site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Build _site using the command from vercel.json itself
        run: |
          set -euo pipefail
          # Read the real command out of the real file. If someone edits
          # vercel.json, this job tests the edit — not a stale transcription.
          BUILD_CMD="$(jq -re '.buildCommand' vercel.json)"
          OUT_DIR="$(jq -re '.outputDirectory' vercel.json)"
          echo "vercel.json buildCommand:      $BUILD_CMD"
          echo "vercel.json outputDirectory:   $OUT_DIR"
          echo "::group::build"
          bash -c "$BUILD_CMD"
          echo "::endgroup::"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Top level of the publish directory must be exactly the allowlist
        run: |
          set -euo pipefail
          EXPECTED=$'assets\nindex.html\nprivacy.html'
          ACTUAL="$(cd "$OUT_DIR" && ls -A | sort)"

          echo "--- expected ---"; echo "$EXPECTED"
          echo "--- actual   ---"; echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo ""
            echo "::error::The publish directory is not the allowlist."
            echo "Anything extra here would be served on the public website."
            diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
            exit 1
          fi
          echo "OK — three entries, nothing else."

      - name: No internal file types anywhere inside the publish directory
        run: |
          set -euo pipefail
          # Belt and braces for the case where something internal is copied
          # INSIDE assets/ rather than at the top level, where the check above
          # would not see it.
          FOUND=0
          while IFS= read -r f; do
            echo "::error file=$f::internal file inside the publish directory"
            FOUND=1
          done < <(find "$OUT_DIR" \( \
              -name '*.md'      -o -name '*.yml'   -o -name '*.yaml' \
            -o -name '*.toml'   -o -name '*.lock'  -o -name '*.sql'  \
            -o -name '*.prisma' -o -name '*.env*'  -o -name '*.pem'  \
            -o -name '*.key'    -o -name '*.ts'    -o -name '*.tsx'  \
            -o -name 'package.json' -o -name 'Dockerfile' -o -name 'docker-compose*' \
            \) -type f | sort)

          [ "$FOUND" -eq 0 ] || { echo "::error::Internal files found in the publish directory."; exit 1; }
          echo "OK — nothing internal inside."

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Publish directory"
            echo ""
            echo "\`$OUT_DIR/\` holds **$(find "$OUT_DIR" -type f | wc -l) files**, top level:"
            echo ""
            echo '```'
            (cd "$OUT_DIR" && ls -A)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  #  Runbook §2, executed against a real deployment.
  # ───────────────────────────────────────────────────────────────────────────
  live-check:
    name: Deployed site serves the right thing, and nothing else
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_url != ''

    env:
      SITE: ${{ github.event.inputs.deployment_url }}
      COMPARE_TO: ${{ github.event.inputs.compare_to }}
      # Optional. Vercel: Project → Settings → Deployment Protection →
      # Protection Bypass for Automation. Without it the firewall may
      # challenge this runner, and the job says so instead of guessing.
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Normalise and sanity-check the URL
        run: |
          set -euo pipefail
          SITE="${SITE%/}"
          case "$SITE" in
            https://*) ;;
            *) echo "::error::deployment_url must start with https:// — got '$SITE'"; exit 1 ;;
          esac
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          echo "Checking: $SITE"

      # ═══════════════════════════════════════════════════════════════════════
      #  ORDER MATTERS, AND SO DOES DETECTING THE FIREWALL
      #
      #  Vercel's firewall escalates on request volume from a datacentre IP,
      #  which is exactly what a GitHub runner is. Two things follow.
      #
      #  1. The cheap, precise checks run FIRST — headers, then the seven
      #     must-serve paths — and the forty-path sweep runs LAST. Earlier
      #     versions had it the other way round and the header check never got
      #     a real response.
      #
      #  2. Every response is inspected for `x-vercel-mitigated`. This is not
      #     cosmetic. A challenge answers 403, and a 403 is exactly what the
      #     must-not-serve check treats as a PASS — so a challenged run would
      #     have reported "every path withheld" while proving nothing whatever.
      #     A check that can pass without testing anything is worse than no
      #     check, because someone will move DNS on the strength of it. Any
      #     challenged response is now INCONCLUSIVE and fails the step.
      #
      #  The durable fix is Vercel's own: Project → Settings → Deployment
      #  Protection → Protection Bypass for Automation. Put that secret in the
      #  repo as VERCEL_AUTOMATION_BYPASS_SECRET and every request below sends
      #  it, so the firewall stays fully on for the public and lets this job
      #  through. Without it the job still runs, and still refuses to pretend.
      # ═══════════════════════════════════════════════════════════════════════

      - name: Set up request helper
        run: |
          set -euo pipefail
          if [ -n "${BYPASS:-}" ]; then
            echo "Protection bypass secret is set — requests will carry x-vercel-protection-bypass."
          else
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set. Vercel's firewall may challenge this runner, in which case the job reports INCONCLUSIVE rather than guessing."
          fi

      - name: Security headers on every URL class
        run: |
          set -uo pipefail   # deliberately NOT -e: a missing header must be
                             # reported, not kill the script before it can say so
          FAIL=0; CHALLENGED=0
          H=/tmp/hdrs.txt

          get () {  # url -> saves headers to $H
            local args=(-sS -D "$H" -o /dev/null --max-time 25)
            [ -n "${BYPASS:-}" ] && args+=(-H "x-vercel-protection-bypass: $BYPASS")
            curl "${args[@]}" "$1" || return 1
            tr -d '\r' < "$H" > "$H.clean" && mv "$H.clean" "$H"
            return 0
          }

          hdr () { grep -i "^$1:" "$H" 2>/dev/null | head -1 | sed 's/^[^:]*: *//' | tr 'A-Z' 'a-z'; return 0; }

          want () {
            local url="$1" name="$2" expect="$3" got
            got="$(hdr "$name")"
            if [ "$got" = "$(echo "$expect" | tr 'A-Z' 'a-z')" ]; then
              printf '  ok        %-24s %s\n' "$name" "$url"
            elif [ -z "$got" ]; then
              printf '  ABSENT    %-24s %s\n' "$name" "$url"
              echo "::error::$url is missing the $name header (expected '$expect')"
              FAIL=1
            else
              printf '  WRONG     %-24s %s\n' "$name" "$url"
              echo "::error::$url — $name is '$got', expected '$expect'"
              FAIL=1
            fi
          }

          check_url () {
            local url="$1" cc="$2" before=$FAIL
            echo "── $url"
            if ! get "$url"; then echo "::error::could not fetch $url"; FAIL=1; return 0; fi

            # Did we reach the site, or the doorman?
            if [ -n "$(hdr 'x-vercel-mitigated')" ] || [ -n "$(hdr 'x-vercel-challenge-token')" ]; then
              printf '  CHALLENGED  %s\n' "$url"
              CHALLENGED=1
              sleep 1
              return 0
            fi

            want "$url" 'x-content-type-options' 'nosniff'
            want "$url" 'x-frame-options'        'SAMEORIGIN'
            want "$url" 'referrer-policy'        'strict-origin-when-cross-origin'
            want "$url" 'permissions-policy'     'geolocation=(), microphone=(), camera=()'
            want "$url" 'cache-control'          "$cc"

            if [ "$FAIL" -ne "$before" ]; then
              echo "  --- response headers as received ---"
              sed 's/^/      /' "$H"
              echo "  ------------------------------------"
            fi
            sleep 1
            return 0
          }

          # privacy.html is the serious one: it carries the version string that
          # consent records are filed against, and a stale copy shows a guest a
          # version their consent was never given for.
          check_url "$SITE/"             'public, max-age=0, must-revalidate'
          check_url "$SITE/index.html"   'public, max-age=0, must-revalidate'
          check_url "$SITE/privacy.html" 'public, max-age=0, must-revalidate'
          check_url "$SITE/assets/js/consent.js"        'public, max-age=3600, must-revalidate'
          check_url "$SITE/assets/photos/hero-team.jpg" 'public, max-age=3600, must-revalidate'

          if [ "$CHALLENGED" -ne 0 ]; then
            echo "::error::Vercel's firewall challenged this runner, so the headers were never observed. This is INCONCLUSIVE — it says nothing about whether the headers are correct. Set VERCEL_AUTOMATION_BYPASS_SECRET (Project → Settings → Deployment Protection → Protection Bypass for Automation) and re-run."
            exit 1
          fi
          [ "$FAIL" -eq 0 ] || exit 1
          echo "All header classes correct."

      - name: Privacy version string is reachable and parseable
        run: |
          set -uo pipefail
          ARGS=(-sS --max-time 25)
          [ -n "${BYPASS:-}" ] && ARGS+=(-H "x-vercel-protection-bypass: $BYPASS")
          BODY="$(curl "${ARGS[@]}" "$SITE/privacy.html")"
          if echo "$BODY" | grep -qi 'x-vercel-challenge\|_vercel/challenge'; then
            echo "::error::Challenged by the firewall — INCONCLUSIVE, not a finding."
            exit 1
          fi
          # Consent records are filed against this exact string. If the deployed
          # page does not carry it, consent cannot be versioned.
          V="$(echo "$BODY" | grep -o 'name="berelax:privacy-version"[^>]*' | head -1)"
          if [ -z "$V" ]; then
            echo "::error::privacy.html does not carry the berelax:privacy-version meta tag"
            exit 1
          fi
          echo "  ok  $V"

      - name: What MUST be served — every line 200
        run: |
          set -uo pipefail
          FAIL=0
          for p in / /index.html /privacy.html \
                   /assets/logo/be-relax-logo-dark.png \
                   /assets/photos/hero-team.jpg \
                   /assets/videos/spa-tour-01.mp4 \
                   /assets/js/consent.js ; do
            ARGS=(-sS -o /dev/null -w '%{http_code}' --max-time 25)
            [ -n "${BYPASS:-}" ] && ARGS+=(-H "x-vercel-protection-bypass: $BYPASS")
            CODE="$(curl "${ARGS[@]}" "$SITE$p" || echo 000)"
            if [ "$CODE" = "403" ] || [ "$CODE" = "429" ]; then
              sleep 12
              CODE="$(curl "${ARGS[@]}" "$SITE$p" || echo 000)"
            fi
            printf '%s  %s\n' "$CODE" "$p"
            [ "$CODE" = "200" ] || { echo "::error::$p returned $CODE, expected 200"; FAIL=1; }
            sleep 1
          done
          [ "$FAIL" -eq 0 ] || exit 1

      # ── §2.2 — the big sweep, deliberately last ─────────────────────────────
      - name: What must NOT be served — nothing but the site
        run: |
          set -uo pipefail

          {
            cat <<'PATHS'
          /platform/
          /platform/package.json
          /platform/pnpm-lock.yaml
          /platform/docker-compose.yml
          /platform/apps/api/package.json
          /platform/apps/api/prisma/schema.prisma
          /platform/apps/dashboard/vercel.json
          /docs/
          /docs/spa-crm-architecture-spec.md
          /docs/compliance/data-processing-register.md
          /docs/compliance/privacy-notice.md
          /docs/compliance/runbooks/data-breach.md
          /docs/runbooks/go-live.md
          /docs/runbooks/netlify-to-vercel.md
          /docs/sql/verify-core-constraints.sql
          /scripts/backup-verify.sh
          /.github/workflows/platform-deploy.yml
          /.github/workflows/platform-ci.yml
          /netlify.toml
          /vercel.json
          /README.md
          /.gitignore
          /.env
          /.env.example
          PATHS
            ALLOWED='index.html privacy.html assets'
            while IFS= read -r entry; do
              case " $ALLOWED " in *" $entry "*) continue ;; esac
              printf '/%s\n/%s/\n' "$entry" "$entry"
            done < <(git ls-tree --name-only HEAD | sed 's#/$##' | sort -u)
          } | sed 's/^ *//' | sort -u > /tmp/must-not-serve.txt

          echo "Checking $(wc -l < /tmp/must-not-serve.txt) paths."
          FAIL=0; CHALLENGED=0; D=/tmp/mns.txt
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            ARGS=(-sS -D "$D" -o /dev/null -w '%{http_code}' --max-time 25)
            [ -n "${BYPASS:-}" ] && ARGS+=(-H "x-vercel-protection-bypass: $BYPASS")
            CODE="$(curl "${ARGS[@]}" "$SITE$p" || echo 000)"

            # A challenge answers 403 — the same code this check calls a pass.
            # Counting it as a pass would mean reporting "withheld" for a path
            # nobody ever asked the site about.
            if grep -qi '^x-vercel-mitigated:\|^x-vercel-challenge-token:' "$D" 2>/dev/null; then
              printf '  %s  %s  <-- CHALLENGED, not verified\n' "$CODE" "$p"
              CHALLENGED=1
            else
              case "$CODE" in
                4??) printf '  %s  %s\n' "$CODE" "$p" ;;
                *)   printf '  %s  %s  <-- LEAK\n' "$CODE" "$p"
                     echo "::error::$p returned $CODE. Anything but a 4xx means the path is reachable. DO NOT MOVE DNS."
                     FAIL=1 ;;
              esac
            fi
            sleep 1
          done < /tmp/must-not-serve.txt

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::A path that must not be public answered. Stop-the-world — see runbook §2.2."
            exit 1
          fi
          if [ "$CHALLENGED" -ne 0 ]; then
            echo "::error::One or more paths were answered by the firewall rather than the site, so they were NOT verified. INCONCLUSIVE — do not read this as 'nothing leaked'. Set VERCEL_AUTOMATION_BYPASS_SECRET and re-run."
            exit 1
          fi
          echo "OK — every path genuinely withheld."

      - name: Optional — diff headers against the site that is live today
        if: env.COMPARE_TO != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          OTHER="${COMPARE_TO%/}"
          hdrs () {
            curl -sS -D - -o /dev/null --max-time 25 "$1" \
              | tr -d '\r' \
              | grep -iE '^(x-content-type-options|x-frame-options|referrer-policy|permissions-policy|cache-control):' \
              | tr 'A-Z' 'a-z' | sed 's/: */: /' | sort
          }
          for p in /privacy.html /assets/photos/hero-team.jpg; do
            echo "--- $p ---"
            diff <(hdrs "$OTHER$p") <(hdrs "$SITE$p") && echo "  identical"
          done
          # `/` may legitimately differ: netlify.toml sets its no-cache rule on
          # /index.html, vercel.json sets it on / as well. More revalidation,
          # never less. Shown for the record, not enforced.
          echo "--- / (informational) ---"
          diff <(hdrs "$OTHER/") <(hdrs "$SITE/") || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment check"
            echo ""
            echo "Target: \`$SITE\`"
            echo ""
            echo "- must-serve paths → 200"
            echo "- must-not-serve paths → 404 (explicit list + every repo root entry)"
            echo "- security headers + cache-control per URL class"
            echo "- privacy version meta tag present"
          } >> "$GITHUB_STEP_SUMMARY"
